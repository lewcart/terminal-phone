name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build --product terminal-phone
      - name: Test
        run: swift test
      - name: Check install.sh
        # Plain ASCII only: macOS bash 3.2 in a UTF-8 locale reads "$var…" as a longer variable name.
        run: |
          bash -n install.sh
          ! LC_ALL=C grep -n '[^ -~	]' install.sh
      - name: Package (local, ad-hoc signed)
        run: bash scripts/release-phone.sh
